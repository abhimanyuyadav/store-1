<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)" />
  <circle cx="50" cy="45" r="24" fill="none" stroke="#fff" stroke-width="4" opacity="0.2">
    <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="50" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="56" fill="#fff">
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum" />
    9
  </text>
</svg>